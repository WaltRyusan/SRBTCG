#
#  project.yml
#  SRBTCG
#
#  .xcodeproj はこのファイルから生成する（xcodegen）。
#  ソースを足したら `xcodegen generate` を打つだけでよく、
#  Xcode を開いてファイルを登録する手間と、pbxproj の競合が無くなる。
#
#  生成物なので .xcodeproj は git 管理しない（.gitignore 参照）。
#

name: SRBTCG

options:
  bundleIdPrefix: com.ryusan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # 生成のたびに差分が出ないよう、ファイルの並びを固定する
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_LANGUAGE: ja
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # 他の3アプリと同じ開発者アカウント
    DEVELOPMENT_TEAM: 974LVD65BN
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "13.10.0"

targets:
  SRBTCG:
    type: application
    platform: iOS
    # iPhone のみ。iPad 対応は v2 で検討する
    deviceFamily: [1]
    sources:
      - path: SRBTCG
      # InfoPlist.strings（アプリ名のローカライズ）
      - path: ja.lproj
      - path: en.lproj
      - path: ko.lproj
      - path: zh-Hans.lproj
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryusan.SRBTCG
        PRODUCT_NAME: SRBTCG
        INFOPLIST_FILE: Info.plist
        # Info.plist は手書きのものを使う（自動生成させない）
        GENERATE_INFOPLIST_FILE: NO

  SRBTCGTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SRBTCGTests]
    dependencies:
      - target: SRBTCG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryusan.SRBTCGTests
        GENERATE_INFOPLIST_FILE: YES

  SRBTCGUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SRBTCGUITests]
    dependencies:
      - target: SRBTCG
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryusan.SRBTCGUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SRBTCG:
    build:
      targets:
        SRBTCG: all
    run:
      config: Debug
      # 課金をシミュレータで試すための設定ファイル。
      # スキームに紐づけないと商品が取得できず、価格が出ない。
      storeKitConfiguration: Configuration.storekit
    test:
      config: Debug
      targets:
        - SRBTCGTests
        - SRBTCGUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
